name: Getaway
options:
  bundleIdPrefix: com.kendallsorenson
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
schemes:
  Getaway:
    build:
      targets:
        Getaway: all
    run:
      # Local subscription testing without App Store Connect products.
      storeKitConfiguration: App/Resources/Kinvoy.storekit
    test:
      targets: []
    archive:
      config: Release
targets:
  Getaway:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kinvoy
        # Without these, XcodeGen writes a literal "1" and the build number
        # comes from Xcode's automatic management at upload time instead of
        # from CURRENT_PROJECT_VERSION below.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Kinvoy shares your location with your family group only while your trip is active and only when you turn sharing on."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kendallsorenson.getaway
            CFBundleURLSchemes: [kinvoy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kendallsorenson.getaway
        PRODUCT_NAME: Getaway
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: 4985QRD6MB
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
